<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGNO QUINIELAS MX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 2px solid #DAA520;
        }
        .hero-banner {
            position: relative;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1000&auto=format&fit=crop') center/cover;
            color: white;
            text-align: center;
            padding: 22px 15px;
            border-bottom: 3px solid #DAA520;
        }
        .hero-banner img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }
        .hero-banner h1 {
            margin: 0;
            font-size: 1.7em;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #FFFFFF;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
        }
        .hero-banner p {
            margin: 4px 0 0 0;
            font-size: 0.85em;
            color: #FFD700;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .subheader {
            background-color: #000;
            color: #FFD700;
            text-align: center;
            padding: 8px;
            font-size: 1em;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .countdown-container {
            background-color: #0a0a0a;
            padding: 12px 10px;
            text-align: center;
            border-bottom: 2px solid #333;
        }
        .countdown-title {
            color: #FFD700;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .countdown-boxes {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .time-box {
            background: linear-gradient(135deg, #222, #111);
            border: 1px solid #444;
            border-radius: 6px;
            padding: 6px 8px;
            min-width: 45px;
            text-align: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }
