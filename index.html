<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magno Quinielas MX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(to right, #8B0000, #006400);
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 1.2em;
        }
        .subheader {
            background-color: #111;
            color: #FFD700;
            text-align: center;
            padding: 5px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
        }
        .team {
            width: 35%;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .team.right {
            justify-content: flex-end;
            text-align: right;
        }
        .team img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .options {
            display: flex;
            gap: 4px;
        }
        .options label {
            border: 1px solid #ccc;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .options input {
            display: none;
        }
        .options input:checked + span {
            background-color: #ddd;
            font-weight: bold;
        }
        .info-bar {
            background: linear-gradient(to right, #DAA520, #228B22);
            color: white;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 0.8em;
            display: flex;
            justify-content: space-between;
        }
        .form-section {
            padding: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-size: 1em;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .total-box {
            border: 1px solid #28a745;
            color: #28a745;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-clear { background-color: #d9534f; }
        .btn-random { background-color: #34495e; }
        .btn-whatsapp {
            background-color: #28a745;
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">MAGNO QUINIELAS MX</div>
    <div class="subheader">MEDIA SEMANA</div>

    <div id="matches-container"></div>

    <div class="info-bar">
        <span>BASE: $100.00 (8 PARTIDOS)</span>
        <span>CIERRE: 11 DE SEPT. 3:30 P. M.</span>
    </div>

    <div class="form-section">
        <input type="text" id="participant-name" placeholder="NOMBRE DEL PARTICIPANTE">
        <div class="total-box" id="total-display">TOTAL: $100.00</div>
        
        <div class="btn-container">
            <button class="btn-clear" onclick="limpiarFormulario()">Limpiar</button>
            <button class="btn-random" onclick="selecciónAleatoria()">Aleatorio</button>
        </div>
        
        <button class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar por WhatsApp 📱</button>
    </div>
</div>

<script>
    const partidos = [
        { id: 1, local: "América", escL: "Club-America-Logo.png", visita: "Cruz Azul", escV: "Cruz-Azul-Logo.png" },
        { id: 2, local: "Chivas", escL: "1280px-Guadalajara_Logo.png", visita: "Pumas", escV: "pumas-unam-logo-png_1280.png" },
        { id: 3, local: "Monterrey", escL: "1280px-Monterrey_Logo.png", visita: "Tigres", escV: "Tigres_UANL_2.jpg" },
        { id: 4, local: "Toluca", escL: "1280px-Club_Toluca_Logo.png", visita: "León", escV: "250px-Fútbol_Club_Atlético_San_Luis_logo.png" },
        { id: 5, local: "Santos", escL: "santos-laguna-logo-footer.png", visita: "Pachuca", escV: "pachuca-logo-png-seeklogo-425251.png" },
        { id: 6, local: "Atlas", escL: "219 (3).png", visita: "Necaxa", escV: "250px-Club_Necaxa_Logo.png" },
        { id: 7, local: "Juárez", escL: "fc-juarez.png", visita: "Tijuana", escV: "414-4142028_club-tijuana.png" },
        { id: 8, local: "Puebla", escL: "231.png", visita: "San Luis", escV: "atletico-de-san-luis.56d296c0.png" }
    ];

    function renderPartidos() {
        const container = document.getElementById('matches-container');
        container.innerHTML = '';
        partidos.forEach(p => {
            container.innerHTML += `
                <div class="match-row">
                    <div class="team">
                        <img src="${p.escL}" alt="${p.local}">
                        <span>${p.local}</span>
                    </div>
                    <div class="options">
                        <label><input type="radio" name="m${p.id}" value="L" onchange="calcularTotal()"><span>L</span></label>
                        <label><input type="radio" name="m${p.id}" value="E" onchange="calcularTotal()"><span>E</span></label>
                        <label><input type="radio" name="m${p.id}" value="V" onchange="calcularTotal()"><span>V</span></label>
                    </div>
                    <div class="team right">
                        <span>${p.visita}</span>
                        <img src="${p.escV}" alt="${p.visita}">
                    </div>
                </div>
            `;
        });
    }

    function calcularTotal() {
        let total = 100;
        document.getElementById('total-display').innerText = `TOTAL: $${total}.00`;
    }

    function limpiarFormulario() {
        document.getElementById('participant-name').value = '';
        partidos.forEach(p => {
            const radios = document.querySelectorAll(`input[name="m${p.id}"]`);
            radios.forEach(r => r.checked = false);
        });
        calcularTotal();
    }

    function selecciónAleatoria() {
        partidos.forEach(p => {
            const opciones = ['L', 'E', 'V'];
            const aleatorio = opciones[Math.floor(Math.random() * opciones.length)];
            const radioSeleccionado = document.querySelector(`input[name="m${p.id}"][value="${aleatorio}"]`);
            if (radioSeleccionado) radioSeleccionado.checked = true;
        });
        calcularTotal();
    }

    function enviarWhatsApp() {
        const nombre = document.getElementById('participant-name').value.trim();
        if(!nombre) {
            alert('Por favor ingresa tu nombre');
            return;
        }
        let mensaje = `*MAGNO QUINIELAS MX*\nParticipante: ${nombre}\n\n*Pronósticos:*\n`;
        partidos.forEach(p => {
            const seleccionado = document.querySelector(`input[name="m${p.id}"]:checked`);
            const pronostico = seleccionado ? seleccionado.value : '-';
            mensaje += `${p.id}. ${p.local} vs ${p.visita} ➡️ *[${pronostico}]*\n`;
        });
        mensaje += `\n*TOTAL: $100.00*`;
        const url = `https://api.whatsapp.com/send?phone=&text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    }

    window.onload = renderPartidos;
</script>

</body>
</html>
