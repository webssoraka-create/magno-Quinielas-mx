<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magno Quinielas MX</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 500px; background: white; margin: auto; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { background: #0b6623; color: white; text-align: center; padding: 12px; border-radius: 8px; margin-top: 0; font-size: 20px; }
        .match { border-bottom: 1px solid #eee; padding: 12px 0; display: flex; flex-direction: column; align-items: center; }
        .teams-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 8px; }
        .team { width: 40%; text-align: center; font-weight: bold; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .team img { width: 40px; height: 40px; object-fit: contain; }
        .vs { font-size: 12px; color: #777; font-weight: bold; }
        .options { display: flex; gap: 8px; justify-content: center; width: 100%; }
        .options button { padding: 6px 12px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; flex: 1; max-width: 70px; }
        .options button.selected { background: #0b6623; color: white; border-color: #0b6623; }
        .btn-whatsapp { display: block; width: 100%; background: #25d366; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px; margin-top: 20px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚽ Magno Quinielas MX ⚽</h2>

    <!-- Partido 1 -->
    <div class="match">
        <div class="teams-row">
            <div class="team">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/Logo_Am%C3%A9rica.svg" alt="América">
                América
            </div>
            <div class="vs">VS</div>
            <div class="team">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/58/Logo_Cruz_Azul.svg" alt="Cruz Azul">
                Cruz Azul
            </div>
        </div>
        <div class="options">
            <button onclick="selectOption(this, 1, 'L')">L</button>
            <button onclick="selectOption(this, 1, 'E')">E</button>
            <button onclick="selectOption(this, 1, 'V')">V</button>
        </div>
    </div>

    <!-- Partido 2 -->
    <div class="match">
        <div class="teams-row">
            <div class="team">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Logo_Guadalajara_-_Chivas.svg" alt="Chivas">
                Chivas
            </div>
            <div class="vs">VS</div>
            <div class="team">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/d4/Logo_Pumas_UNAM.svg" alt="Pumas">
                Pumas
            </div>
        </div>
        <div class="options">
            <button onclick="selectOption(this, 2, 'L')">L</button>
            <button onclick="selectOption(this, 2, 'E')">E</button>
            <button onclick="selectOption(this, 2, 'V')">V</button>
        </div>
    </div>

    <a href="#" class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar Quiniela por WhatsApp</a>
</div>

<script>
    let selections = {};
    function selectOption(btn, matchId, choice) {
        let parent = btn.parentElement;
        parent.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selections[matchId] = choice;
    }

    function enviarWhatsApp() {
        let mensaje = "¡Hola! Esta es mi quiniela de MagnoQuinielasMx:%0A";
        for (let match in selections) {
            mensaje += `- Partido ${match}: ${selections[match]}%0A`;
        }
        let telefono = "5219842794702";
        let url = `https://wa.me/${telefono}?text=${mensaje}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
