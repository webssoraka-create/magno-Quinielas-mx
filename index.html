<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGNO QUINIELAS MX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 10px;
            color: #000000;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            overflow: hidden;
            border: none;
            box-shadow: none;
        }
        .hero-banner {
            position: relative;
            background: #ffffff;
            color: #000000;
            text-align: center;
            padding: 22px 15px;
            border-bottom: 2px solid #FFD700;
        }
        .hero-banner img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin-bottom: 6px;
        }
        .hero-banner h1 {
            margin: 0;
            font-size: 1.7em;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #000000;
        }
        .hero-banner p {
            margin: 4px 0 0 0;
            font-size: 0.85em;
            color: #333333;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .subheader {
            background: #ffffff;
            color: #000000;
            text-align: center;
            padding: 10px;
            font-size: 1.05em;
            font-weight: 900;
            letter-spacing: 2px;
            border-bottom: 1px solid #ddd;
        }
        .accumulative-banner {
            background: #ffffff;
            color: #000000;
            text-align: center;
            padding: 10px;
            font-size: 0.85em;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 1px solid #ddd;
        }
        .countdown-container {
            background-color: #ffffff;
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        .countdown-title {
            color: #333333;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .countdown-boxes {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .time-box {
            background: #ffffff;
            border: 1px solid #FFD700;
            border-radius: 6px;
            padding: 6px 8px;
            min-width: 45px;
            text-align: center;
        }
        .time-number {
            display: block;
            color: #000000;
            font-size: 1.2em;
            font-weight: 900;
            font-family: monospace;
        }
        .time-label {
            display: block;
            color: #555555;
            font-size: 0.6em;
            margin-top: 2px;
            text-transform: uppercase;
        }
        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.9em;
            background-color: #ffffff;
        }
        /* Estructura dividida en cuadrícula / cajas claras y uniformes para cada equipo */
        .team {
            width: 35%;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: #000000;
            background-color: #f8f9fa;
            border: 1px solid #e0e0e0;
            padding: 6px 8px;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .team.right {
            justify-content: flex-end;
            text-align: right;
        }
        .team img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .options {
            display: flex;
            gap: 4px;
        }
        .options label {
            border: 1px solid #ccc;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            background: #ffffff;
            color: #000000;
            font-weight: bold;
        }
        .options input {
            display: none;
        }
        .options input:checked + span {
            background-color: #000000;
            color: #FFD700;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
        }
        .info-bar {
            background: #ffffff;
            color: #000000;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 0.82em;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }
        .form-section {
            padding: 15px;
            background-color: #ffffff;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            background-color: #ffffff;
            color: #000000;
            border-radius: 6px;
            text-align: center;
            font-size: 1.05em;
            box-sizing: border-box;
            margin-bottom: 12px;
            font-weight: bold;
        }
        input[type="text"]::placeholder {
            color: #999999;
        }
        .total-box {
            border: 2px solid #000000;
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 1.1em;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: 1px solid #000000;
            border-radius: 6px;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95em;
            background-color: #000000;
        }
        .btn-clear { 
            background-color: #666666;
            border-color: #666666;
        }
        .btn-random { 
            background-color: #333333;
            border-color: #333333;
        }
        .btn-whatsapp {
            background-color: #25D366;
            border: 2px solid #25D366;
            color: #ffffff;
            width: 100%;
            padding: 14px;
            font-size: 1.15em;
            margin-bottom: 10px;
        }
        .btn-help-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            color: #333333;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9em;
            text-align: center;
        }
        .btn-help-whatsapp img {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero-banner">
        <img src="magno quinielas mx.png" alt="Logo Magno Quinielas MX" onerror="this.style.display='none'">
        <h1>MAGNO QUINIELAS MX</h1>
        <p>Tus pronósticos valen oro</p>
    </div>
    
    <div class="subheader">⭐ MEDIA SEMANA ⭐</div>
    
    <div class="accumulative-banner">
        QUINIELA ACUMULABLE ($100 ENTRADA)
    </div>

    <div class="countdown-container">
        <div class="countdown-title">Cierre de Quiniela</div>
        <div class="countdown-boxes">
            <div class="time-box">
                <span class="time-number" id="days">00</span>
                <span class="time-label">Días</span>
            </div>
            <div class="time-box">
                <span class="time-number" id="hours">00</span>
                <span class="time-label">Horas</span>
            </div>
            <div class="time-box">
                <span class="time-number" id="minutes">00</span>
                <span class="time-label">Min</span>
            </div>
            <div class="time-box">
                <span class="time-number" id="seconds">00</span>
                <span class="time-label">Seg</span>
            </div>
        </div>
    </div>

    <div id="matches-container"></div>

    <div class="info-bar">
        BASE: $100.00 (9 PARTIDOS) | CIERRE: 11 DE SEPT. 3:30 P. M.
    </div>

    <div class="form-section">
        <input type="text" id="participant-name" placeholder="NOMBRE DEL PARTICIPANTE">
        <div class="total-box" id="total-display">TOTAL: $100.00</div>
        
        <div class="btn-container">
            <button class="btn-clear" onclick="limpiarFormulario()">Limpiar</button>
            <button class="btn-random" onclick="selecciónAleatoria()">Aleatorio</button>
        </div>
        
        <button class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar Quiniela por WhatsApp 📱</button>
        
        <a href="https://api.whatsapp.com/send?phone=5219842794702&text=Hola,%20quisiera%20más%20información%20sobre%20cómo%20se%20juega%20la%20quiniela." class="btn-help-whatsapp" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
            ¿Dudas? Más información sobre cómo se juega
        </a>
    </div>
</div>

<script>
    // Partidos actualizados con el logo correcto de Querétaro ("960px-Querétaro_F.C._logo.svg.png") y Atlante
    const partidos = [
        { id: 1, local: "Necaxa", escL: "250px-Club_Necaxa_Logo.svg.png", visita: "Puebla", escV: "231.png" },
        { id: 2, local: "Atlante", escL: "1280px-Atlante_FC_2022_Logo.svg.png", visita: "Pachuca", escV: "pachuca-logo-png_seeklogo-288768.png" },
        { id: 3, local: "Tijuana", escL: "414-4142028_club-tijuana-logo-ohio-wesleyan-soccer-logo-hd.png", visita: "Querétaro", escV: "960px-Querétaro_F.C._logo.svg.png" },
        { id: 4, local: "Toluca", escL: "1280px-Club_Toluca_Logo.svg.png", visita: "Atlas", escV: "250px-Fútbol_Club_Atlas.svg.png" },
        { id: 5, local: "León", escL: "04a814c4039eca50e7f7a3cc56ceaaa0.jpg", visita: "San Luis", escV: "atletico-de-san-luis.56dacec6.png" },
        { id: 6, local: "Cruz Azul", escL: "Cruz-Azul-Logo.png", visita: "América", escV: "Club-America-Logo.png" },
        { id: 7, local: "Guadalajara", escL: "219 (3).png", visita: "Pumas", escV: "pumas-unam-logo-png_seeklogo-177354.png" },
        { id: 8, local: "Santos", escL: "santos-laguna-logo-footylogos-1200.webp", visita: "Juárez", escV: "fc-juarez.png" },
        { id: 9, local: "Monterrey", escL: "500px-Club_de_Fútbol_Monterrey_logo.svg.png", visita: "Tigres", escV: "Tigres_UANL_2.jpg" }
    ];

    function renderPartidos() {
        const container = document.getElementById('matches-container');
        container.innerHTML = '';
        partidos.forEach(p => {
            container.innerHTML += `
                <div class="match-row">
                    <div class="team">
                        <img src="${p.escL}" alt="${p.local}">
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${p.local}</span>
                    </div>
                    <div class="options">
                        <label><input type="checkbox" name="m${p.id}" value="L" onchange="verificarLimiteYCalcular(this)"><span>L</span></label>
                        <label><input type="checkbox" name="m${p.id}" value="E" onchange="verificarLimiteYCalcular(this)"><span>E</span></label>
                        <label><input type="checkbox" name="m${p.id}" value="V" onchange="verificarLimiteYCalcular(this)"><span>V</span></label>
                    </div>
                    <div class="team right">
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${p.visita}</span>
                        <img src="${p.escV}" alt="${p.visita}">
                    </div>
                </div>
            `;
        });
    }

    function verificarLimiteYCalcular(element) {
        let totalSelecciones = 0;

        partidos.forEach(p => {
            const checks = document.querySelectorAll(`input[name="m${p.id}"]:checked`);
            totalSelecciones += checks.length;
        });

        if (totalSelecciones > 13) {
            alert("⚠️ Límite máximo alcanzado de selecciones.");
            element.checked = false;
        }
        calcularTotal();
    }

    function calcularTotal() {
        let total = 100;
        let totalSelecciones = 0;

        partidos.forEach(p => {
            const checks = document.querySelectorAll(`input[name="m${p.id}"]:checked`);
            totalSelecciones += checks.length;
        });

        if (totalSelecciones > 9) {
            let extras = totalSelecciones - 9;
            if (extras === 1) total = 125;
            else if (extras === 2) total = 150;
            else if (extras === 3) total = 200;
            else if (extras >= 4) total = 400;
        }

        document.getElementById('total-display').innerText = `TOTAL: $${total}.00`;
    }

    function limpiarFormulario() {
        document.getElementById('participant-name').value = '';
        partidos.forEach(p => {
            const checks = document.querySelectorAll(`input[name="m${p.id}"]`);
            checks.forEach(c => c.checked = false);
        });
        calcularTotal();
    }

    function selecciónAleatoria() {
        limpiarFormulario();
        partidos.forEach(p => {
            const opciones = ['L', 'E', 'V'];
            const aleatorio = opciones[Math.floor(Math.random() * opciones.length)];
            const checkSeleccionado = document.querySelector(`input[name="m${p.id}"][value="${aleatorio}"]`);
            if (checkSeleccionado) checkSeleccionado.checked = true;
        });
        calcularTotal();
    }

    function actualizarCronometro() {
        const fechaCierre = new Date('September 11, 2026 15:30:00').getTime();
        const ahora = new Date().getTime();
        const diferencia = fechaCierre - ahora;

        if (diferencia < 0) {
            document.getElementById('days').innerText = "00";
            document.getElementById('hours').innerText = "00";
            document.getElementById('minutes').innerText = "00";
            document.getElementById('seconds').innerText = "00";
            return;
        }

        const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
        const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
        const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

        document.getElementById('days').innerText = String(dias).padStart(2, '0');
        document.getElementById('hours').innerText = String(horas).padStart(2, '0');
        document.getElementById('minutes').innerText = String(minutos).padStart(2, '0');
        document.getElementById('seconds').innerText = String(segundos).padStart(2, '0');
    }

    setInterval(actualizarCronometro, 1000);

    function enviarWhatsApp() {
        const nombre = document.getElementById('participant-name').value.trim();
        if(!nombre) {
            alert('Por favor ingresa tu nombre');
            return;
        }

        let partidosConPronostico = 0;
        let totalSelecciones = 0;

        partidos.forEach(p => {
            const checks = document.querySelectorAll(`input[name="m${p.id}"]:checked`);
            if (checks.length > 0) {
                partidosConPronostico++;
            }
            totalSelecciones += checks.length;
        });

        if (partidosConPronostico < partidos.length) {
            let faltantes = partidos.length - partidosConPronostico;
            alert(`⚠️ Faltan partidos por pronosticar. Te faltan ${faltantes} partido${faltantes > 1 ? 's' : ''} por seleccionar.`);
            return;
        }

        let mensaje = `*⭐ MAGNO QUINIELAS MX (ACUMULABLE) ⭐*\nParticipante: ${nombre}\n\n*Pronósticos:*\n`;
        
        partidos.forEach(p => {
            const checks = document.querySelectorAll(`input[name="m${p.id}"]:checked`);
            let pronosticos = Array.from(checks).map(c => c.value).join('/');
            mensaje += `${p.id}. ${p.local} vs ${p.visita} ➡️ *[${pronosticos}]*\n`;
        });

        let total = 100;
        if (totalSelecciones > 9) {
            let extras = totalSelecciones - 9;
            if (extras === 1) total = 125;
            else if (extras === 2) total = 150;
            else if (extras === 3) total = 200;
            else if (extras >= 4) total = 400;
        }

        mensaje += `\n*TOTAL: $${total}.00*`;
        
        const url = `https://api.whatsapp.com/send?phone=5219842794702&text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    }

    window.onload = function() {
        renderPartidos();
        actualizarCronometro();
    };
</script>

</body>
    </html>
